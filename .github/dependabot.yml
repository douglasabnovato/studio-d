version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Um PR só por rodada para todas as Actions (#24).
    groups:
      actions:
        patterns:
          - "*"
