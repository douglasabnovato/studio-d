name: CI

on:
  pull_request:
    branches: [main, 'developer/**']
  push:
    branches: [main, 'developer/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main, nunca cancelar: um deploy do Pages pela metade deixa o site quebrado.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

  # Publica no Pages só a partir da main, depois dos dois jobs, e só quando a Variable
  # PAGES_ATIVO for "true" (o responsável liga o Pages com a fonte "GitHub Actions").
  publicar:
    name: publicar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ATIVO == 'true'
    needs: [verificar, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Mede o LCP móvel no site publicado depois de cada deploy (#59). Fica vermelho se a
  # mediana passar de 2,5 s, mas o deploy já foi feito: falhar aqui não desfaz nada.
  lcp:
    name: lcp
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL_DO_SITE: https://douglasabnovato.github.io/studio-d/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # O Pages pode servir o build anterior por alguns minutos: medir só o build novo.
      - name: Esperar o site servir este build
        run: |
          for i in $(seq 1 20); do
            node scripts/conferir-site.ts "$URL_DO_SITE" --build dist/index.html && exit 0
            sleep 30
          done
          exit 1
      - name: Lighthouse móvel, 3 execuções
        run: |
          for i in 1 2 3; do
            npx -y lighthouse@12.8.2 "$URL_DO_SITE" --form-factor=mobile --only-categories=performance \
              --output=json --output-path="lh-$i.json" --quiet --chrome-flags="--headless=new --no-sandbox" \
              || echo "A execução $i falhou; o resumo a marca como inválida."
          done
      - name: Resumo do LCP
        run: node scripts/medir-lcp.ts "$URL_DO_SITE" "$(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)" lh-1.json lh-2.json lh-3.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lh-*.json
          if-no-files-found: ignore
