name: CI

on:
  pull_request:
    branches: [main, 'developer/**']
  push:
    branches: [main, 'developer/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main, nunca cancelar: um deploy do Pages pela metade deixa o site quebrado.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  # Publica no Pages só a partir da main, depois dos dois jobs, e só quando a Variable
  # PAGES_ATIVO for "true" (o responsável liga o Pages com a fonte "GitHub Actions").
  publicar:
    name: publicar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ATIVO == 'true'
    needs: [verificar, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
